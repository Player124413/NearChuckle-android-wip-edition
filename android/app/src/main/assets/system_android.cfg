-- NearChuckle Android mega-optimization system.cfg
-- This file is auto-copied to game folder on first launch if missing
-- Tuning for ALL phones: dynamic LOD, texture streaming, FPS limiter

sys_spec = 1
sys_spec_full = 1
-- Rendering via ANGLE Vulkan: avoid Cg compile stutter
r_Driver = "OpenGL"
r_Width = 1280
r_Height = 720
r_ColorBits = 32
r_DepthBits = 24
r_StencilBits = 8
r_Fullscreen = 1
r_DisplayInfo = 0
r_VSync = 0
r_FSAAMode = 0
r_FSAA = 0
r_TexResolution = 0
r_TexQuality = 0
r_TexSkyResolution = 0
r_TexBumpResolution = 1
r_Texture_Anisotropic_Level = 2
r_Texture_CompreSSION = 1
r_UsePOM = 0
r_UseSoftParticles = 0
r_WaterReflections = 0
r_WaterRefractions = 0
r_VolumetricFog = 0
r_ShadowBlur = 0
r_ShadowType = 1
-- disable expensive decals hack for GLES
r_DisableLevelDecalsHack = 0

-- ANGLE optimization
r_GLES_UseAngle = 1
gl_useextensions = 1

-- Texture streaming: mega optimization for low RAM (2-4GB)
r_TexturesStreaming = 2
r_TexturesStreamingMaxRequestedMB = 64
r_TexturesStreamingResidencyTime = 60
r_MipProcedures = 1

-- LOD
e_obj_lod_ratio = 60
e_vegetation_sprites_distance_ratio = 0.6
e_detail_texture_ratio = 50
e_max_entity_lights = 8
e_terrain_lod_ratio = 50

-- Physics & AI throttling for mobile CPUs (4-8 cores, big.LITTLE)
p_max_substeps = 2
ai_update_interval = 0.1
es_UpdateEntityComponents = 1

-- Sound
s_SoundEnable = 1
s_SoundVolume = 255
s_MusicEnable = 1
s_MusicVolume = 200
s_SpeakerConfig = 2

-- Input / touch
i_mouse_accel = 0.15
i_mouse_accel_max = 50
i_mouse_smooth = 0
cl_sensitivity = 0.25

-- System: GC, streaming budget
sys_streaming_memory_budget = 24
sys_StreamCallbackTimeBudget = 500
sys_physics_CPU = 2
sys_affinity = 0

-- Android specifics
sys_android_touch = 1
sys_android_dynres = 1
sys_android_dynres_min = 0.6
sys_android_dynres_max = 1.0
sys_android_maxfps = 60
sys_android_low_power = 0
sys_android_vulkan_via_angle = 1

-- Disable editor/dev
log_Verbosity = 0
log_FileVerbosity = 0
