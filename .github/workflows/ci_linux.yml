name: CI Linux

on: [push, pull_request]

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "release", "workflow_dispatch", "schedule"]'

  build-linux:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        arch: [x64]
    name: 'Linux [${{ matrix.arch }}, ${{ matrix.configuration }}]'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install libs
      run: |
        sudo apt-get update && sudo apt-get install -y meson libgl-dev ninja-build cmake pkg-config libopenal-dev libvorbis-dev || true
        # Try SDL3 from apt if available, else fetch
        sudo apt-get install -y libsdl3-dev 2>&1 | tail -n 20 || echo "SDL3 not in apt, will use subproject if present"
    - name: Configure and build
      run: |
        mkdir -p build && cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.configuration}} -DDISABLE_CG=ON
        ninja -k 0
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: farcry.${{ matrix.arch }}-${{ matrix.configuration }}
        path: bin/${{ matrix.arch }}-${{ matrix.configuration }}
        if-no-files-found: warn

permissions: write-all
