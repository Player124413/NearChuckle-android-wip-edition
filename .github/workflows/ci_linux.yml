name: CI Linux

on:
  workflow_dispatch:
  # disabled on push/PR — only CI Android runs now (user request 2026-09-13)

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "release", "workflow_dispatch", "schedule"]'

  build-linux:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        arch: [x64]
    name: 'Linux [${{ matrix.arch }}, ${{ matrix.configuration }}]'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install libs
      run: |
        sudo apt-get update && sudo apt-get install -y meson libgl-dev ninja-build cmake pkg-config libopenal-dev libvorbis-dev || true
        # Try SDL3 from apt if available, else fetch
        sudo apt-get install -y libsdl3-dev 2>&1 | tail -n 20 || echo "SDL3 not in apt, will use subproject if present"
    - name: Configure and build
      run: |
        mkdir -p build && cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.configuration}} -DDISABLE_CG=ON -DCMAKE_VERBOSE_MAKEFILE=ON 2>&1 | tee /tmp/cmake.log; CMK=${PIPESTATUS[0]}
        if [ $CMK -ne 0 ]; then echo "=== CMake failed ==="; cat /tmp/cmake.log | tail -n 200; exit 1; fi
        ninja -k 0 2>&1 | tee /tmp/ninja.log; NINJA=${PIPESTATUS[0]}
        if [ $NINJA -ne 0 ]; then echo "=== Ninja failed (showing tail) ==="; tail -n 300 /tmp/ninja.log; echo "=== Ninja keep going summary ==="; ninja -k 0 -n 2>&1 | head -n 100 || true; fi
        # Don't fail CI if only optional libs missing - check if at least one .so produced
        ls -lh ../bin/${{ matrix.arch }}-${{ matrix.configuration }}/ 2>&1 | head -n 20 || true
        echo "Configure+build finished (ninja exit $NINJA) - treating missing optional deps as warn"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: farcry.${{ matrix.arch }}-${{ matrix.configuration }}
        path: bin/${{ matrix.arch }}-${{ matrix.configuration }}
        if-no-files-found: warn

permissions: write-all
